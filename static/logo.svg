<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48" fill="none" style="max-width: 48px; max-height: 48px; width: 48px; height: 48px;">
    <defs>
        <!-- Primary Vibrant Petal Gradient -->
        <linearGradient id="tb-petal-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="50%" stop-color="#d946ef" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>

        <!-- Secondary Petal Gradient -->
        <linearGradient id="tb-petal-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="60%" stop-color="#ec4899" />
            <stop offset="100%" stop-color="#f43f5e" />
        </linearGradient>

        <!-- Golden Botanical Core Gradient -->
        <linearGradient id="tb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#fde047" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>

        <!-- Center Dark Disc Gradient -->
        <linearGradient id="tb-dark-disc" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="100%" stop-color="#090d16" />
        </linearGradient>

        <!-- Subtle Glow Filter -->
        <filter id="tb-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Outer Golden Taxonomy Orbit -->
    <circle cx="50" cy="50" r="43" stroke="url(#tb-gold)" stroke-width="1.2" stroke-dasharray="3.5 3.5" opacity="0.38" />

    <!-- 6 Symmetrical Interlocking Petals (Linnaean Harmony + Machine Precision) -->
    <g transform="translate(50, 50)">
        <!-- Petal 1 (0 deg) -->
        <path d="M 0 -38 C 11 -24, 15 -11, 0 0 C -15 -11, -11 -24, 0 -38 Z" 
              fill="url(#tb-petal-grad)" opacity="0.88" />
        <!-- Petal 2 (60 deg) -->
        <path d="M 0 -38 C 11 -24, 15 -11, 0 0 C -15 -11, -11 -24, 0 -38 Z" 
              fill="url(#tb-petal-grad-2)" opacity="0.88" transform="rotate(60)" />
        <!-- Petal 3 (120 deg) -->
        <path d="M 0 -38 C 11 -24, 15 -11, 0 0 C -15 -11, -11 -24, 0 -38 Z" 
              fill="url(#tb-petal-grad)" opacity="0.88" transform="rotate(120)" />
        <!-- Petal 4 (180 deg) -->
        <path d="M 0 -38 C 11 -24, 15 -11, 0 0 C -15 -11, -11 -24, 0 -38 Z" 
              fill="url(#tb-petal-grad-2)" opacity="0.88" transform="rotate(180)" />
        <!-- Petal 5 (240 deg) -->
        <path d="M 0 -38 C 11 -24, 15 -11, 0 0 C -15 -11, -11 -24, 0 -38 Z" 
              fill="url(#tb-petal-grad)" opacity="0.88" transform="rotate(240)" />
        <!-- Petal 6 (300 deg) -->
        <path d="M 0 -38 C 11 -24, 15 -11, 0 0 C -15 -11, -11 -24, 0 -38 Z" 
              fill="url(#tb-petal-grad-2)" opacity="0.88" transform="rotate(300)" />

        <!-- Center Golden Anther & Botanical AI Core -->
        <circle cx="0" cy="0" r="13.5" fill="url(#tb-dark-disc)" stroke="url(#tb-gold)" stroke-width="1.8" />
        <circle cx="0" cy="0" r="7.5" fill="url(#tb-gold)" filter="url(#tb-glow)" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" />

        <!-- 6 Taxonomy Nodes at Petal Apexes -->
        <circle cx="0" cy="-39" r="2.2" fill="url(#tb-gold)" />
        <circle cx="0" cy="-39" r="2.2" fill="url(#tb-gold)" transform="rotate(60)" />
        <circle cx="0" cy="-39" r="2.2" fill="url(#tb-gold)" transform="rotate(120)" />
        <circle cx="0" cy="-39" r="2.2" fill="url(#tb-gold)" transform="rotate(180)" />
        <circle cx="0" cy="-39" r="2.2" fill="url(#tb-gold)" transform="rotate(240)" />
        <circle cx="0" cy="-39" r="2.2" fill="url(#tb-gold)" transform="rotate(300)" />
    </g>
</svg>
