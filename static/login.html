<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaxoBloom — Login</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">

<style>
body {
    font-family: "Poppins", sans-serif;
    background: radial-gradient(circle at 50% 20%, #111d38 0%, #0a1124 55%, #060a17 100%);
    min-height: 100vh;
}
.blur-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-top: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.75), 0 0 50px -10px rgba(168, 85, 247, 0.18);
}
.ambient-glow {
    position: absolute;
    width: 460px;
    height: 460px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(236, 72, 153, 0.1) 50%, transparent 70%);
    filter: blur(60px);
    pointer-events: none;
    animation: pulseGlow 8s ease-in-out infinite alternate;
}
@keyframes pulseGlow {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.15); opacity: 1; }
}
.fade-in {
    animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-5px); }
    40%, 80% { transform: translateX(5px); }
}
.shake {
    animation: shake 0.4s ease-in-out;
}

/* 🛡️ Strict Element Constraints */
img {
    max-width: 100%;
    height: auto;
}
svg {
    display: inline-block;
    vertical-align: middle;
    flex-shrink: 0;
    max-width: 100%;
}
.brand-logo {
    width: 40px !important;
    height: 40px !important;
    max-width: 40px !important;
    max-height: 40px !important;
    object-fit: contain !important;
}
</style>
</head>

<body class="flex flex-col justify-between min-h-screen text-white p-6 relative overflow-x-hidden selection:bg-purple-500 selection:text-white">

<!-- Ambient Glow -->
<div class="ambient-glow top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

<!-- ✅ AUTO-REDIRECT IF ALREADY LOGGED IN -->
<script>
if (localStorage.getItem("loggedIn") === "true") {
    window.location.href = "/dashboard";
}
</script>

<div class="w-full"></div>

<!-- 🌿 LOGIN BOX -->
<div class="blur-card p-8 sm:p-10 rounded-3xl w-full max-w-sm mx-auto fade-in text-center relative z-10 transition-all duration-300">

    <!-- Brand Logo Mark -->
    <div class="w-12 h-12 mx-auto mb-3.5 rounded-2xl bg-white/5 border border-white/10 p-2 flex items-center justify-center shadow-inner" style="width: 48px; height: 48px;">
        <img src="/static/logo.svg" alt="TaxoBloom Logo" width="32" height="32" class="brand-logo drop-shadow-[0_0_10px_rgba(168,85,247,0.5)]" />
    </div>

    <!-- Luxury Status Pill -->
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs text-yellow-300/90 mb-4 shadow-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="font-medium tracking-wide">Botanical Intelligence</span>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-yellow-300 to-amber-300 tracking-tight mb-2">
        TaxoBloom Login
    </h1>
    <p class="text-gray-300 text-sm mb-6 font-light">
        Welcome back! Login to continue.
    </p>

    <!-- Form -->
    <form id="loginForm" onsubmit="return false;" class="space-y-4 text-left">
        
        <!-- Username with Icon -->
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                </svg>
            </div>
            <input
                id="username"
                type="text"
                required
                placeholder="Username (admin)"
                class="w-full pl-10 pr-4 py-3 rounded-xl bg-gray-900/60 border border-gray-700/80 text-white placeholder-gray-400 outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-500/25 transition text-sm shadow-inner"
                autocomplete="username"
            />
        </div>

        <!-- Password with Icon & Toggle -->
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                </svg>
            </div>
            <input
                id="password"
                type="password"
                required
                placeholder="Password (1234)"
                class="w-full pl-10 pr-10 py-3 rounded-xl bg-gray-900/60 border border-gray-700/80 text-white placeholder-gray-400 outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-500/25 transition text-sm shadow-inner"
                autocomplete="current-password"
            />
            <button type="button" id="togglePass" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-white transition" title="Show/Hide Password">
                <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>
        </div>

        <!-- Caps Lock Indicator -->
        <p id="capsWarning" class="hidden text-[11px] text-amber-300 flex items-center gap-1 font-medium">
            <span>⚠️ Caps Lock is on</span>
        </p>

        <!-- Remember Me & Quick Fill -->
        <div class="flex items-center justify-between text-xs text-gray-400 pt-0.5">
            <label class="flex items-center gap-1.5 cursor-pointer hover:text-gray-300">
                <input type="checkbox" checked class="rounded bg-gray-900 border-gray-700 text-purple-500 focus:ring-0 w-3.5 h-3.5 cursor-pointer" />
                <span>Remember me</span>
            </label>
            <button type="button" id="demoFill" class="text-yellow-300 hover:text-yellow-200 transition underline underline-offset-4 decoration-yellow-300/40 font-medium">
                Auto-fill demo
            </button>
        </div>

        <!-- Login Button -->
        <button
            id="loginBtn"
            type="submit"
            class="w-full mt-2 py-3.5 rounded-xl font-semibold text-sm bg-gradient-to-r from-purple-500 via-fuchsia-500 to-pink-500 hover:opacity-95 hover:shadow-lg hover:shadow-purple-500/30 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 shadow-md shadow-purple-500/20"
        >
            <span>Login</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
            </svg>
        </button>

    </form>

    <!-- Error Message -->
    <p id="errorMsg" class="mt-4 text-rose-400 text-xs hidden font-medium">
        Invalid username or password. (Use: admin / 1234)
    </p>

</div>

<!-- Real Website Simple Footer -->
<footer class="w-full text-center py-4 text-gray-500 text-xs relative z-10 flex items-center justify-center gap-4">
    <span>© 2026 TaxoBloom</span>
    <span>&bull;</span>
    <a href="javascript:void(0)" class="hover:text-gray-300 transition">Privacy</a>
    <span>&bull;</span>
    <a href="javascript:void(0)" class="hover:text-gray-300 transition">Terms</a>
    <span>&bull;</span>
    <a href="javascript:void(0)" class="hover:text-gray-300 transition">Support</a>
</footer>

<script>
// Toggle Password
const togglePass = document.getElementById("togglePass");
const passInput = document.getElementById("password");
togglePass.addEventListener("click", () => {
    const isPass = passInput.type === "password";
    passInput.type = isPass ? "text" : "password";
});

// Caps Lock Warning
const capsWarning = document.getElementById("capsWarning");
passInput.addEventListener("keyup", (e) => {
    if (e.getModifierState("CapsLock")) {
        capsWarning.classList.remove("hidden");
    } else {
        capsWarning.classList.add("hidden");
    }
});

// Demo Fill
document.getElementById("demoFill").addEventListener("click", () => {
    document.getElementById("username").value = "admin";
    document.getElementById("password").value = "1234";
    document.getElementById("errorMsg").classList.add("hidden");
});

// Handle Login
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const errorMsg = document.getElementById("errorMsg");
const card = document.querySelector(".blur-card");

loginForm.addEventListener("submit", () => {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    errorMsg.classList.add("hidden");

    if (user === "admin" && pass === "1234") {
        localStorage.setItem("loggedIn", "true");
        loginBtn.innerHTML = `
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>Logging in...</span>
        `;
        setTimeout(() => {
            window.location.href = "/dashboard";
        }, 300);
    } else {
        errorMsg.classList.remove("hidden");
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
    }
});
</script>

</body>
</html>
